; Mosannen overrides. Radiography files are large, so the upload limits
; must clear the biggest sensor image the clinic produces.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 512M
max_execution_time = 120

; The legacy importer streams hundreds of thousands of rows.
max_input_vars = 5000

date.timezone = Asia/Tehran

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off
